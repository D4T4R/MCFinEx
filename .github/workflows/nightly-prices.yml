name: Nightly prices

# Closing prices and any newly listed symbols. Deliberately not a re-scrape:
# fundamentals change quarterly, prices daily, and a full scrape is ~40 minutes
# of requests to a free service.
#
# NSE publishes the bhavcopy after the close -- 15:30 IST is 10:00 UTC, and the
# file lands a while later -- so this runs at 14:37 UTC (20:07 IST) on weekdays.
#
# :37 rather than :00 deliberately. GitHub runs schedules best-effort and warns
# that the top of the hour is its busiest slot; over three weeks on "0 14" not a
# single run ever started on the hour -- the earliest was 26 minutes late, the
# latest 9h23m, and on 2026-09-07 the run was dropped entirely rather than
# merely delayed. An odd minute does not make it guaranteed, nothing does, but
# it is the one factor on this side of the API.
#
# Lateness is survivable regardless: the loader walks back to the most recent
# published session, so a late or missed run corrects itself the next night, and
# exchange holidays need no special handling.
on:
  schedule:
    - cron: "37 14 * * 1-5"
  workflow_dispatch: {}

# Never let two refreshes overlap: they write the same rows.
concurrency:
  group: nightly-prices
  cancel-in-progress: false

# Read the repo, publish the screen to Pages. `id-token` is what
# actions/deploy-pages uses to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MCFINEX_PG: ${{ secrets.MCFINEX_PG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The postgres extra: the job writes to the hosted database, and a
        # plain install carries no driver.
        run: pip install -e ".[postgres]"

      - name: Check the secret is present
        run: |
          if [ -z "$MCFINEX_PG" ]; then
            echo "MCFINEX_PG is not set. Add it under" \
                 "Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      # Unions several sessions, because a bhavcopy lists only what traded that
      # day: illiquid small caps drop out and would look like delistings.
      - name: Pick up newly listed symbols
        run: mcfinex universe

      # Seeding a company only gives it a symbol, an ISIN and a price. Screening
      # needs financials, and until it has them the company is invisible in the
      # app -- so without this a new listing waited for the quarterly scrape,
      # up to three months.
      #
      # Measured at 2.3s per company, so 60 is about two and a half minutes
      # against a 20-minute job that currently uses four. Bounded rather than
      # `--all` for two reasons: `--all` walks every stored ticker asking
      # needs_refresh one company at a time, which is ~2,600 round trips to
      # Supabase before the first page is fetched; and an unbounded batch after
      # a large seeding would run into the timeout.
      #
      # Before `prices`, not after: scraping writes screener's price rounded to
      # the rupee, and `prices` is what replaces it with the exact close and
      # revalues. The other order would leave the new companies a day stale.
      - name: Scrape companies seeded but never scraped
        run: mcfinex scrape --missing 60

      - name: Refresh closing prices
        run: mcfinex prices

      - name: Show what the app will serve
        run: mcfinex screen -n 10 --min-buys 8

      # Published from this job rather than a scheduled one of its own. A
      # separate workflow would have to guess how long the refresh takes, and
      # GitHub's scheduler has been observed lagging by three hours here -- so
      # a fixed offset would eventually publish yesterday's prices as today's.
      # Running in the same job means it can only ever see the data it just
      # wrote. Enrichment (22:00 UTC) is picked up by the next night's run.
      - name: Build the static site the phone app reads
        run: mcfinex publish --out site

      - name: Check the site is not empty
        # `publish` already refuses an empty screen, but the artifact upload
        # would happily deploy a directory that failed to fill for any other
        # reason, and a broken deploy is silent: the app just sees old data.
        run: |
          companies=$(ls site/company | wc -l)
          echo "index.json: $(wc -c < site/index.json) bytes, $companies companies"
          if [ "$companies" -lt 100 ]; then
            echo "only $companies company files; refusing to deploy" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Split out because deploy-pages needs the github-pages environment, and
  # granting that to the job holding the database credential is more access
  # than either step needs.
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After the deploy, not alongside it. A notification is an invitation to open
  # the company page, so the site it opens should already be the one the alert
  # was computed from.
  #
  # Holds the database credential -- it re-screens to compare against the stored
  # state -- but not `pages` or `id-token`, which it has no use for.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MCFINEX_PG: ${{ secrets.MCFINEX_PG }}
      MCFINEX_FCM: ${{ secrets.MCFINEX_FCM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[postgres,notify]"

      - name: Send what changed
        # Absent rather than failed: push is the last thing to be set up, and a
        # red nightly job every night until Firebase exists would train whoever
        # reads it to ignore the red. The command itself is not silent -- it
        # refuses to advance the alert state if a send fails, so nothing is
        # quietly dropped once this is switched on.
        run: |
          if [ -z "$MCFINEX_FCM" ]; then
            echo "MCFINEX_FCM is not set, so no push was sent. Add the Firebase" \
                 "service account JSON under Settings > Secrets and variables >" \
                 "Actions to turn alerts on."
            exit 0
          fi
          mcfinex notify

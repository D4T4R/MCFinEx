name: Nightly prices

# Closing prices and any newly listed symbols. Deliberately not a re-scrape:
# fundamentals change quarterly, prices daily, and a full scrape is ~40 minutes
# of requests to a free service.
#
# NSE publishes the bhavcopy after the close -- 15:30 IST is 10:00 UTC, and the
# file lands a while later -- so this runs at 13:00 UTC (18:30 IST) on weekdays.
# GitHub's scheduler is best-effort and can lag under load, which does not
# matter here: the loader walks back to the most recent published session, so a
# late or missed run corrects itself the next night, and exchange holidays need
# no special handling.
on:
  schedule:
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}

# Never let two refreshes overlap: they write the same rows.
concurrency:
  group: nightly-prices
  cancel-in-progress: false

# Read the repo, publish the screen to Pages. `id-token` is what
# actions/deploy-pages uses to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MCFINEX_PG: ${{ secrets.MCFINEX_PG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # The postgres extra: the job writes to the hosted database, and a
        # plain install carries no driver.
        run: pip install -e ".[postgres]"

      - name: Check the secret is present
        run: |
          if [ -z "$MCFINEX_PG" ]; then
            echo "MCFINEX_PG is not set. Add it under" \
                 "Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      # Unions several sessions, because a bhavcopy lists only what traded that
      # day: illiquid small caps drop out and would look like delistings.
      - name: Pick up newly listed symbols
        run: mcfinex universe

      - name: Refresh closing prices
        run: mcfinex prices

      - name: Show what the app will serve
        run: mcfinex screen -n 10 --min-buys 8

      # Published from this job rather than a scheduled one of its own. A
      # separate workflow would have to guess how long the refresh takes, and
      # GitHub's scheduler has been observed lagging by three hours here -- so
      # a fixed offset would eventually publish yesterday's prices as today's.
      # Running in the same job means it can only ever see the data it just
      # wrote. Enrichment (22:00 UTC) is picked up by the next night's run.
      - name: Build the static site the phone app reads
        run: mcfinex publish --out site

      - name: Check the site is not empty
        # `publish` already refuses an empty screen, but the artifact upload
        # would happily deploy a directory that failed to fill for any other
        # reason, and a broken deploy is silent: the app just sees old data.
        run: |
          companies=$(ls site/company | wc -l)
          echo "index.json: $(wc -c < site/index.json) bytes, $companies companies"
          if [ "$companies" -lt 100 ]; then
            echo "only $companies company files; refusing to deploy" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Split out because deploy-pages needs the github-pages environment, and
  # granting that to the job holding the database credential is more access
  # than either step needs.
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

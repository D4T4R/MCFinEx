[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcfinex"
version = "2.0.0"
description = "Scrape Indian company financials from screener.in and populate the SSP valuation workbook"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.40", "pandas>=2.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
mcfinex = "mcfinex.cli:main"
mcfinex-dashboard = "mcfinex.ui.launch:main"
mcfinex-api = "mcfinex.api_launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcfinex = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

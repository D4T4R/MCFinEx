[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcfinex"
version = "2.0.0"
description = "Scrape Indian company financials from screener.in and populate the SSP valuation workbook"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# authlib is what st.login() needs; without it Streamlit raises
# StreamlitMissingAuthlibError the moment anyone tries to sign in. The
# floor is 1.42 because that is where native OIDC arrived.
ui = ["streamlit>=1.42", "pandas>=2.0", "authlib>=1.3.2"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
postgres = ["psycopg[binary]>=3.1"]
# FCM HTTP v1 is OAuth2 only -- the legacy server key was switched off in 2024
# -- so sending push needs something that can mint a token from a service
# account. Kept out of the base install: only the nightly job ever sends.
notify = ["google-auth>=2.27"]

[project.scripts]
mcfinex = "mcfinex.cli:main"
mcfinex-dashboard = "mcfinex.ui.launch:main"
mcfinex-api = "mcfinex.api_launch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcfinex = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
